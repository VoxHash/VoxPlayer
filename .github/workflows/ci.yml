name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black mypy pytest
    
    - name: Lint with flake8
      run: |
        # Hard-fail on syntax/undefined-name class errors
        flake8 app.py voxplayer/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Style report is advisory until a dedicated formatting pass (matches black/mypy below)
        flake8 app.py voxplayer/ --count --max-complexity=15 --max-line-length=120 --statistics || true
    
    - name: Check formatting with black
      run: |
        black --check app.py voxplayer/ || true
    
    - name: Type check with mypy
      run: |
        mypy app.py voxplayer/ --ignore-missing-imports || true

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Linux runtime dependencies for PyQt6 + libvlc
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1 \
          libegl1 \
          libxkbcommon-x11-0 \
          libpulse-mainloop-glib0 \
          vlc \
          libvlc-dev \
          libvlccore-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Stage + e2e native_core bundle (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python packaging/stage_native_core.py --force
        python scripts/e2e_native_core_bundle.py
        python scripts/independence_matrix.py

    - name: E2E FOSS libav backend (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
        VOXPLAYER_DECODE: libav
      run: |
        pip install "av>=12"
        python scripts/e2e_libav_backend.py
        # #79: auto-fallback when system libvlc is unavailable
        unset VOXPLAYER_DECODE || true
        python scripts/e2e_no_system_vlc.py
        # #80: meta/thumbs/viz without ffmpeg CLI
        python scripts/e2e_no_ffmpeg_cli.py
    
    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python test.py || true
        pytest --version || echo "Pytest not configured yet"
    
    - name: Test imports
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONIOENCODING: utf-8
      run: |
        python -c "import sys; sys.path.insert(0, '.'); import os; os.environ['QT_QPA_PLATFORM'] = 'offscreen'; from app import VoxPlayerMainWindow, main; print('[OK] Imports successful')" || python -c "import sys; sys.path.insert(0, '.'); import os; os.environ['QT_QPA_PLATFORM'] = 'offscreen'; from voxplayer.app import VoxPlayerMainWindow, main; print('[OK] Imports successful')"
    
    - name: Syntax check
      run: |
        python -m py_compile app.py || echo "app.py not found, skipping"
        python -m py_compile voxplayer/app.py || echo "voxplayer/app.py not found, skipping"

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install build wheel
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check build artifacts
      run: |
        ls -la dist/ || echo "No dist directory"
